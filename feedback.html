<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedstar Motors | Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="contactus.html">Contact Us</a></li>
            <li><a href="aboutus.html"> About Us</a></li>
            <li><a href="feedback.html"> Feedback</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="product.html">Product</a></li>
        </ul>
    </nav>
</header>

<h1 class="feedback-heading">We Value Your Feedback</h1> <!-- Formal Level 1 Heading -->

<section class="container">
    <form id="form" action="/" method="GET" onsubmit="return validateform()">
        <div>
            <label for="name">Name</label>
            <input type="text" name="name" placeholder="Enter your name" id="name" required>
            <div id="nameError" class="error"></div>
        </div>
        
        <div>
            <label for="email">Email</label>
            <input type="email" name="Email" id="email" placeholder="Enter your email" required>
            <div id="emailError" class="error"></div>
        </div>
        
        <div>
            <label for="message">Message</label>
            <textarea name="message" id="message" placeholder="Enter your message" rows="6" required></textarea>
            <div id="feedbackError" class="error"></div>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</section>

<footer>
    <p>&copy;2025 Speedstar Motor <strong>Ganja</strong></p>
</footer>

<script>
    function validateform() {
        let isValid = true;
        
        // Get form input values
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let message = document.getElementById("message").value.trim();

        // Get error elements
        let nameError = document.getElementById("nameError");
        let emailError = document.getElementById("emailError");
        let feedbackError = document.getElementById("feedbackError");

        // Reset error messages
        nameError.textContent = "";
        emailError.textContent = "";
        feedbackError.textContent = "";

        // Validate Name (Minimum 3 characters)
        if (name.length < 3) {
            nameError.textContent = "Name must be at least 3 characters long.";
            isValid = false;
        }

        // Validate Email (Basic pattern check)
        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
            emailError.textContent = "Please enter a valid email address.";
            isValid = false;
        }

        // Validate Message (Minimum 10 characters)
        if (message.length < 10) {
            feedbackError.textContent = "Message must be at least 10 characters long.";
            isValid = false;
        }

        return isValid;
    }
</script>

</body>
</html>
